[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
masterror = { workspace = true }
regex = "1"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls",
] }
tempfile = "3"

[lints]
workspace = true
