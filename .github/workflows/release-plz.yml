# Two-mode release automation driven by release-plz:
#   `release-pr` keeps a single release PR open against `main`, bumping the
#   version and prepending a CHANGELOG section as conventional commits land;
#   `release` runs after that PR is merged — it publishes the crate to
#   crates.io, tags `vX.Y.Z`, and creates the GitHub release.
#
# Authentication uses the `GH_TOKEN` PAT secret (not the workflow
# GITHUB_TOKEN) so the release PR triggers the regular CI checks. If
# `GH_TOKEN` is absent, set it up as a repository secret with
# `contents:write` and `pull-requests:write` scopes. See `release-plz.toml`
# for configuration and `RELEASE.md` for the human-facing flow.

name: Release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'RAprogramm' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-semver-checks

      - name: Run release-plz release
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'RAprogramm' }}
    needs: release-plz-release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-semver-checks

      - name: Run release-plz release-pr
        id: release_pr
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # release-plz bumps Cargo.toml but cannot know about the generated
      # README/skill sections; regenerate them on the release branch so the
      # CI "readme refresh" gate on the release PR stays green.
      - name: Sync generated docs with the bumped version
        if: ${{ steps.release_pr.outputs.pr != '' }}
        env:
          PR_JSON: ${{ steps.release_pr.outputs.pr }}
        run: |
          set -euo pipefail
          branch=$(printf '%s' "$PR_JSON" | jq -er '.head_branch')
          git fetch origin "$branch"
          git checkout "$branch"
          cargo run -p update-readme
          if git diff --quiet -- README.md skills; then
            echo "generated docs already in sync with the bumped version"
          else
            git config user.name "github-actions[bot]"
            bot_email="41898282+github-actions[bot]@users.noreply.github.com"
            git config user.email "$bot_email"
            git add README.md skills
            git commit -m "chore: sync generated docs with the bumped version"
            git push origin "$branch"
          fi
