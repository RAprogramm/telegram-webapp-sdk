[package]
name = "serverless-example"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
] }
telegram-webapp-sdk = { path = "../..", features = ["mock"] }

[[bin]]
name = "serverless"
path = "src/main.rs"
test = false
bench = false

[lints]
workspace = true
