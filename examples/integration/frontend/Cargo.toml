[package]
name = "webapp-integration-frontend"
version = "0.1.0"
edition = "2024"
# This crate is excluded from the workspace, so it cannot inherit rust-version.
# Kept in sync with [workspace.package] rust-version by `cargo make check-msrv`.
rust-version = "1.99"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
telegram-webapp-sdk = { path = "../../..", features = ["macros"] }
wasm-bindgen = "0.2"