# cargo-audit configuration.
#
# Every entry below is an "unmaintained" notice for a transitive dependency we
# do not control and for which no fixed upgrade is published as of 2026-10-19.
# Each comment records the upstream path that pulls the crate in and why it
# cannot be dropped from this workspace. Re-check periodically and remove an
# entry as soon as an upstream release supersedes it.
[advisories]
ignore = [
    # bincode 1.3.3 <- gloo-worker 0.5 <- gloo 0.11 <- yew 0.23.
    # yew 0.23.0 is the latest release and still depends on the unmaintained
    # bincode, so there is no upgrade path available from this workspace.
    "RUSTSEC-2025-0141",
    # paste 1.0.15 <- tachys 0.2 <- leptos 0.8.
    # leptos 0.8.22 is the latest release and still depends on paste; no fix
    # is available upstream.
    "RUSTSEC-2024-0436",
    # proc-macro-error 1.0.4 <- yew-macro 0.23 <- yew 0.23.
    # proc-macro-error is abandoned upstream and yew 0.23.0 (latest) still
    # depends on it; no upgrade path available from this workspace.
    "RUSTSEC-2024-0370",
    # proc-macro-error2 2.0.1 <- aquamarine 0.6 <- teloxide 0.17.
    # teloxide 0.17.0 and aquamarine 0.6.0 are the latest published versions
    # and still depend on it; no fixed upgrade exists upstream.
    "RUSTSEC-2026-0173",
]
